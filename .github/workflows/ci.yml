# Build and test Bcf.Core. No BIM application is installed on the runner,
# and that is precisely what this workflow proves.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build Bcf.Core/Bcf.Core.csproj -c Release --nologo

      - name: Test
        run: dotnet test Bcf.Core.Tests/Bcf.Core.Tests.csproj -c Release --nologo
