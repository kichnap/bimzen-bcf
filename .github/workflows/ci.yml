# Сборка и тесты Bcf.Core. Navisworks здесь не нужен вовсе — это и проверяется.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build Bcf.Core/Bcf.Core.csproj -c Release --nologo

      - name: Test
        run: dotnet test Bcf.Core.Tests/Bcf.Core.Tests.csproj -c Release --nologo
