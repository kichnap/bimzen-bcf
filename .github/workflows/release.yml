# Publishes BimZen.Bcf.Core to nuget.org when a version tag is pushed.
#
# There is no API key in this repository and there is not meant to be one:
# nuget.org issues a temporary key in exchange for a GitHub OIDC token, and
# that key lives for an hour. The trust is registered on nuget.org against
# this repository and this file name, so renaming the file breaks publishing
# until the policy is updated to match.
#
# Run by hand to rehearse: everything happens except the push, which is the
# only irreversible step — a version on nuget.org can be unlisted but never
# replaced. The rehearsal proves the token exchange works before a tag makes
# it matter.
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Push to nuget.org (otherwise it is a rehearsal)'
        type: boolean
        default: false

jobs:
  publish:
    runs-on: windows-latest

    permissions:
      # Without this the OIDC token is never issued and the login step fails
      # with no useful explanation.
      id-token: write
      contents: read

    env:
      PUBLISHING: ${{ github.event_name == 'push' || inputs.publish }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      # A tag says what the maintainer meant to release; the csproj says what
      # would actually be published. Disagreement between them is a mistake
      # worth catching before the package is on nuget.org for good. A manual
      # run has no tag to compare against, so it only reports the version.
      - name: Check the tag against the package version
        shell: pwsh
        run: |
          $xml = [xml](Get-Content Bcf.Core/Bcf.Core.csproj)
          $version = ($xml.Project.PropertyGroup.Version | Where-Object { $_ }) -join ''

          if ('${{ github.ref_type }}' -eq 'tag') {
            $tag = '${{ github.ref_name }}' -replace '^v', ''
            if ($tag -ne $version) {
              throw "The tag says $tag while Bcf.Core.csproj says $version."
            }
          }

          Write-Host "Version $version"

      - name: Test
        run: dotnet test Bcf.Core.Tests/Bcf.Core.Tests.csproj -c Release --nologo

      - name: Pack
        run: dotnet pack Bcf.Core/Bcf.Core.csproj -c Release --nologo -o artifacts

      # The temporary key is valid for an hour, so it is asked for here and
      # not at the top of the job. A rehearsal asks for one too: the token
      # exchange is the part worth testing, and an unused key simply expires.
      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          # The nuget.org profile name, not an email address. Set it under
          # Settings - Secrets and variables - Actions - Variables.
          user: ${{ vars.NUGET_USER }}

      - name: Push
        if: env.PUBLISHING == 'true'
        run: >
          dotnet nuget push artifacts/*.nupkg
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Rehearsal, nothing was pushed
        if: env.PUBLISHING != 'true'
        run: echo "The package was built and nuget.org issued a key. Nothing was published."

      - uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: artifacts/*
